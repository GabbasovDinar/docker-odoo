name: Build Base CE Image

on:
  push:
    branches: [19.0]
    paths:
      - "base/**"
      - ".github/workflows/base-ce-image.yml"
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: base-ce-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: odoo-base
  IMAGE_TAG: 19.0-ce

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase owner
        id: repo
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base CE image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: base/Dockerfile
          push: true
          pull: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            ODOO_EDITION=ce
            ODOO_CE_VERSION=19.0
            ODOO_CE_REF=19.0
          cache-from: type=gha,scope=base-ce
          cache-to: type=gha,mode=max,scope=base-ce
